  The same hexagon the app's own header draws (`#brand-hex` in
  packages/web/src/index.html), lifted out as a standalone file because an icon
  has to exist before the page does. Keep the two in step by eye: this is not
  generated from that one, since that one is a `<symbol>` in a template.
-->
