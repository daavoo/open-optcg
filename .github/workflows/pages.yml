name: Deploy hosted app

# The hosted copy of the app, on GitHub Pages. It is the same single HTML file
# `pnpm web:build` produces, and it carries no card art and no printed card
# text: the player loads their own asset pack into it (docs/asset-packs.md).
# Publishing it is fine because nothing of Bandai's is in it, nor in the
# get-cards.js served beside it.
#
# Pages has to be switched on once in the repository settings, with "GitHub
# Actions" as the source; until then this workflow fails at the deploy step.

on:
  push:
    branches: [main]
  # A new `model-*` release redeploys with its model; a dated app release
  # rebuilds the same page, which is harmless.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The learned opponent: the newest `model-*` release's pack, published
      # beside the page as learned-model.json rather than inlined, so the page
      # draws first and fetches it after (packages/web/src/learned-model.ts).
      # See ml/README.md for publishing one.
      - run: pnpm model:fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm web:build --external-model
      # The in-browser asset downloader the app's "Get cards" bookmark loads
      # from this site (tools/get-cards.ts). Code only: it fetches the cards
      # from Bandai's page in the player's browser.
      - run: pnpm get-cards:build
      - run: |
          mkdir -p site
          cp dist/open-optcg.html site/index.html
          cp dist/get-cards.js site/get-cards.js
          if [ -f dist/learned-model.json ]; then cp dist/learned-model.json site/; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
