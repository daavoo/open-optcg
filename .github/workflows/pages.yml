name: Deploy hosted app

# The hosted copy of the app, on GitHub Pages. It is the same single HTML file
# `pnpm web:build` produces, and it carries no card art and no printed card
# text: the player loads their own asset pack into it (docs/asset-packs.md).
# Publishing it is fine because nothing of Bandai's is in it, nor in the
# get-cards.js served beside it.
#
# The one exception is the OP-18 pre-release page at /op18/: it carries
# OP-18's art and text, fetched from Bandai's card list on each deploy, so a
# new player can open packs without the Get cards step. Nothing of it is
# committed.
#
# Pages has to be switched on once in the repository settings, with "GitHub
# Actions" as the source; until then this workflow fails at the deploy step.

on:
  push:
    branches: [main]
  # A new `model-*` release redeploys with its model; a dated app release
  # rebuilds the same page, which is harmless.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  # actions: read lists this run's artifacts, for the wait before deploying.
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The learned opponent: the newest `model-*` release's pack, published
      # beside the page as learned-model.json rather than inlined, so the page
      # draws first and fetches it after (packages/web/src/learned-model.ts).
      # See ml/README.md for publishing one.
      - run: pnpm model:fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm web:build --external-model
      # The in-browser asset downloader the app's "Get cards" bookmark loads
      # from this site (tools/get-cards.ts). Code only: it fetches the cards
      # from Bandai's page in the player's browser.
      - run: pnpm get-cards:build
      - run: |
          mkdir -p site
          cp dist/open-optcg.html site/index.html
          cp dist/get-cards.js site/get-cards.js
          if [ -f dist/learned-model.json ]; then cp dist/learned-model.json site/; fi
      # The OP-18 pre-release page (packages/web/src/prerelease.ts), at
      # /op18/. It plays the model trained on OP-18 sealed decks when a
      # `prerelease-op18-model` release carries one, the main model otherwise.
      # It inlines OP-18's text and art, its pack photo and the sealed Leader;
      # if Bandai cannot be reached the page ships without them and asks for
      # Get cards as before, rather than holding up the main page's deploy.
      - run: |
          gh release download prerelease-op18-model -p scorer-model.json -D prerelease-model || true
          flags="--prerelease=OP18 --external-model"
          if [ -f prerelease-model/scorer-model.json ]; then
            flags="$flags --model=prerelease-model/scorer-model.json"
          fi
          if pnpm assets:download --set=OP18 --text-only --output=prerelease-assets/text \
            && pnpm art:download OP18 --output=prerelease-assets/art \
            && pnpm art:download SEALED --output=prerelease-assets/art \
            && pnpm art:download BOOSTERS --output=prerelease-assets/art; then
            flags="$flags --with-art=prerelease-assets/art --with-text=prerelease-assets/text/printed-text.json"
          fi
          pnpm web:build $flags
          mkdir -p site/op18
          cp dist/prerelease/open-optcg.html site/op18/index.html
          cp dist/get-cards.js site/op18/get-cards.js
          if [ -f dist/prerelease/learned-model.json ]; then cp dist/prerelease/learned-model.json site/op18/; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # deploy-pages looks the artifact up straight away, and GitHub's
      # artifact listing can lag the upload: the lookup then finds none and
      # the deploy fails ("No artifacts named github-pages"), though a rerun
      # passes. So wait, up to two minutes, until the run lists it; drop this
      # once deploy-pages retries the lookup itself.
      - run: |
          for i in $(seq 60); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[].name' | grep -qx github-pages && exit 0
            sleep 2
          done
          echo "github-pages artifact still not listed; deploying anyway"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: deployment
        uses: actions/deploy-pages@v5
