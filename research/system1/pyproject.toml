[project]
name = "sys1"
version = "0.0.1"
description = "System-1 legal-action scorer for Open OPTCG, trained with MLX on Apple silicon"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mlx>=0.29",
  "numpy",
  "tokenizers",
  "huggingface_hub",
  "safetensors",
]

[dependency-groups]
# Only for checking the MLX encoder against the reference implementation.
parity = ["torch", "transformers"]

[tool.uv]
package = false
